<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - SkillSwap</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5F7F2;
            color: #24352A;
        }

        nav {
            background: #1B4332;
            padding: 20px 6%;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .card {
            background: #FFFFFF;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #DDE5DC;
        }

        h1 {
            color: #1B4332;
            margin-top: 0;
        }

        .subtitle {
            color: #6B7280;
            line-height: 1.5;
        }

        .admin-info {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 13px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #B8C9B8;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2E7D32;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2E7D32;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #256628;
        }

        .error {
            background: #FEE2E2;
            color: #B91C1C;
            padding: 10px;
            border-radius: 7px;
        }

        .back {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #DDE5DC;
        }

        .back a {
            color: #2E7D32;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <nav>

        <a href="{% url 'login' %}" class="logo">
            SkillSwap Admin
        </a>

    </nav>


    <div class="container">

        <div class="card">

            <h1>
                Admin Login
            </h1>

            <p class="subtitle">
                Login to manage SkillSwap users and
                administration.
            </p>


            <div class="admin-info">

                Only authorized administrators can
                access this page.

            </div>


            {% if admin_error %}

                <p class="error">
                    {{ admin_error }}
                </p>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <label>
                    Admin Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >


                <label>
                    Admin Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >


                <button type="submit">
                    Login as Admin
                </button>

            </form>


            <div class="back">

                <a href="{% url 'login' %}">
                    ← Back to User Login
                </a>

            </div>

        </div>

    </div>


</body>

</html>
