<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SkillSwap</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #F5F7F2;
            color: #24352A;
        }

        nav {
            background: white;
            padding: 18px 6%;
            border-bottom: 1px solid #DDE5DC;
        }

        .logo {
            color: #2E7D32;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #DDE5DC;
        }

        h1 {
            color: #1B4332;
            margin-top: 0;
        }

        p {
            color: #6B7280;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #B8C9B8;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2E7D32;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .error {
            color: #B91C1C;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2E7D32;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'login' %}" class="logo">
            SkillSwap
        </a>
    </nav>


    <div class="container">

        <div class="card">

            <h1>Create Account</h1>

            <p>
                Join SkillSwap and exchange your skills.
            </p>


            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p class="login">
                Already have an account?
                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </div>

    </div>

</body>

</html>
